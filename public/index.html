<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlotSender</title>
  <link rel="stylesheet" href="./index.css">
  <script defer src="./js/main.js"></script>
  <script defer src="./js/serial.js"></script>
  <script defer src="./js/photo.js"></script>
  <script defer src="./js/health.js"></script>
</head>
<body>
  <header>
    <span>PlotSender</span>
  </header>

  <main>
    <div class="server-check">
      <button id="check-server" type="button">サーバー接続確認</button>
      <span id="server-status" role="status" aria-live="polite"></span>
    </div>
    <nav aria-label="作業モード">
      <button type="button" data-tab="a" aria-controls="workspace" aria-pressed="true">描馬灯</button>
      <button type="button" data-tab="b" aria-controls="workspace" aria-pressed="false">パンタグラフ</button>
      <button type="button" data-tab="connectwifi" aria-controls="connectwifi" aria-pressed="false">ConnectWifi</button>
    </nav>

    <div class="panel">
    <!-- a・bで共通の作業画面 -->
    <section id="workspace">
      <h1 id="mode-title">a</h1>
      <p>ペンプロッター用データ作成</p>
      <div class="image-stages">
      <div class="image-upload">
        <label class="upload-box" for="image-input">
          <span>画像を選択</span>
          <img id="image-preview" alt="選択した画像" hidden>
        </label>
        <input id="image-input" type="file" accept="image/*" aria-describedby="image-status">
        <p id="image-status" role="status"></p>
      </div>
      <div class="ai-result">
        <div class="result-box">
          <span>AI処理の結果</span>
          <img id="ai-preview" alt="AIで加工した画像" hidden>
        </div>
        <button id="connect-esp" type="button">ESP32と接続</button>
        <span id="esp-status" role="status"></span>
        <button id="send-to-ai" type="button" disabled>Send to AI</button>
        <p id="ai-status" role="status" aria-live="polite"></p>
      </div>
      </div>
    </section>

    <section id="connectwifi" hidden>
      <p>test</p>
    </section>
    </div>
  </main>
</body>
</html>
