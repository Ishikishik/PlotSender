<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlotSender</title>
  <link rel="stylesheet" href="./index.css">
  <script defer src="./js/main.js"></script>
  <script defer src="./js/serial.js"></script>
  <script defer src="./js/library.js"></script>
  <script defer src="./js/normalize.js"></script>
  <script defer src="./js/vectorize.js"></script>
  <script defer src="./js/photo.js"></script>
  <script defer src="./js/calibration-ui.js"></script>
  <script defer src="./js/health.js"></script>
</head>
<body>
  <header>
    <span>PlotSender</span>
  </header>

  <main>
    <div class="server-check">
      <button id="check-server" type="button">サーバー接続確認</button>
      <span id="server-status" role="status" aria-live="polite"></span>
    </div>
    <nav aria-label="作業モード">
      <button type="button" data-tab="a" aria-controls="workspace" aria-pressed="true">描馬灯</button>
      <button type="button" data-tab="b" aria-controls="workspace" aria-pressed="false">パンタグラフ</button>
      <button type="button" data-tab="connectwifi" aria-controls="connectwifi" aria-pressed="false">ConnectWifi</button>
    </nav>

    <div class="panel">
    <!-- a・bで共通の作業画面 -->
    <section id="workspace">
      <h1 id="mode-title">a</h1>
      <p>ペンプロッター用データ作成</p>
      <div class="image-stages">
      <div class="image-upload">
        <label class="upload-box" for="image-input">
          <span>画像を選択</span>
          <img id="image-preview" alt="選択した画像" hidden>
        </label>
        <input id="image-input" type="file" accept="image/*" aria-describedby="image-status">
        <p id="image-status" role="status"></p>
      </div>
      <div class="ai-result">
        <div class="result-box">
          <span>AI処理の結果</span>
          <img id="ai-preview" alt="AIで加工した画像" hidden>
        </div>
        <button id="connect-esp" type="button">ESP32と接続</button>
        <span id="esp-status" role="status"></span>
        <button id="send-to-ai" type="button" disabled>Send to AI</button>
        <p id="ai-status" role="status" aria-live="polite"></p>
      </div>
      <div class="plot-result">
        <div class="result-box">
          <span>プロッタ再現</span>
          <canvas id="plot-preview" hidden></canvas>
        </div>
        <button id="download-plot" type="button" disabled>JSON保存</button>
        <p id="plot-status" role="status" aria-live="polite"></p>
        <p id="paper-status" role="status" aria-live="polite"></p>
      </div>
      </div>

      <!-- パンタグラフのタブだけに出す -->
      <section id="calibration" class="calibration" hidden>
        <h2>補正(パンタグラフ)</h2>
        <p>機械が使っている補正データ: <span id="cal-current">確認中…</span></p>
        <ol>
          <li>機械の &gt;_ タブで「Cal grid」(補正ありで描く)か「Cal grid raw」(補正なしで描く)を選び、補正シートに格子を描く</li>
          <li>シートの 4 つのマーカーと格子が全部写るように、真上から明るく撮る</li>
          <li>描いたときの補正を選んで、写真を送る(機械の画面の QR を読み取って開いたときだけ送れます)</li>
        </ol>
        <fieldset class="cal-mode">
          <label><input type="radio" name="cal-mode" value="update" checked> 補正ありで描いた(今の補正データに残りを足す)</label>
          <label><input type="radio" name="cal-mode" value="new"> 補正なしで描いた(新しく作る)</label>
        </fieldset>
        <input id="cal-input" type="file" accept="image/*">
        <button id="cal-send" type="button" disabled>補正データを作って送る</button>
        <p id="cal-status" role="status" aria-live="polite"></p>
        <canvas id="cal-debug" hidden></canvas>
        <pre id="cal-log"></pre>
      </section>
    </section>

    <section id="connectwifi" hidden>
      <p>test</p>
    </section>
    </div>
  </main>
</body>
</html>
